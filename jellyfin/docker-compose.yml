services:
  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    # Optional - specify the uid and gid you would like Jellyfin to use instead of root
    user: $UID:$GID
    ports:
      - ${JELLYFIN_PORT}:8096/tcp
      # - 7359:7359/udp
    volumes:
      - ./config/config:/config
      - ./cache:/cache
      - /data/media:/media

      # Optional - extra fonts to be used during transcoding with subtitle burn-in
      # - type: bind
      #   source: /path/to/fonts
      #   target: /usr/local/share/fonts/custom
      #   read_only: true
    restart: 'unless-stopped'
    # Optional - alternative address used for autodiscovery
    environment:
      JELLYFIN_PublishedServerUrl: https://${JELLYFIN_SUBDOMAIN}.${DOMAIN_NAME}
      JELLYFIN_PORT: ${JELLYFIN_PORT}
      UID: $UID
      GID: $GID
      TZ: $TZ
    networks:
      - revproxy
    # Optional - may be necessary for docker healthcheck to pass if running in host network mode
    # extra_hosts:
      # - 'host.docker.internal:host-gateway'
    labels:
      - traefik.enable=true
      - traefik.http.services.jellyfin.loadbalancer.server.port=8096
      - traefik.http.services.jellyfin.loadBalancer.passHostHeader=true
      - traefik.http.routers.jellyfin.rule=Host(`${JELLYFIN_SUBDOMAIN}.${DOMAIN_NAME}`)
      - traefik.http.routers.jellyfin.entrypoints=web,websec
      - traefik.http.routers.jellyfin.service=jellyfin

networks:
  revproxy:
    external: true

