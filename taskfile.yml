# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

vars:
  LINKWARDEN_DIR: '{{ .TASKFILE_DIR }}/linkwarden'
  HOMELAB_SECRETS_REMOTE: 'git+ssh://git@github.com/dee-tree/homelab.secrets.git'
  HOMELAB_SECRETS_REPO: '{{ .HOMELAB_SECRETS_REPO | default .HOMELAB_SECRETS_REMOTE }}'

tasks:
  deploy:*:
    desc: "deploy lab to the host. Note: ensure there is ssh config with the same hostname as target host for system-manager"
    vars:
      LAB: "{{ index .MATCH 0 }}"
    dir: "{{ .TASKFILE_DIR }}"
    cmds:
      - cmd: echo "Deploying homelab with '{{ .HOMELAB_SECRETS_REPO }}' secrets"
      - cmd: cp flake.lock flake.lock.original
      - cmd: nix flake lock --override-input secrets {{.HOMELAB_SECRETS_REPO}}
      - cmd: "nix run github:numtide/system-manager -- switch --flake .#{{ .LAB }} --sudo --target-host {{ .LAB }}"
      - cmd: rm flake.lock && mv flake.lock.original flake.lock

  check:*:
    desc: "Check the config without deploying it. Note: ensure there is ssh config with the same hostname as target host for system-manager"
    vars:
      LAB: "{{ index .MATCH 0 }}"
    dir: "{{ .TASKFILE_DIR }}"
    cmds:
      - cmd: "nix build .#systemConfigs.{{ .LAB }} --override-input secrets {{.HOMELAB_SECRETS_REPO}}"

  xray_uri:*:*:
    desc: "Get xray client configuration URI. Usage: xray_uri:host:client"
    vars:
      HOST: "{{ index .MATCH 0 }}"
      CLIENT: "{{ index .MATCH 1 }}"
    dir: "{{ .TASKFILE_DIR }}"
    cmds:
      - "nix eval --raw .#lib.xrayClientUri.{{ .HOST }}.{{ .CLIENT }} --override-input secrets {{ .HOMELAB_SECRETS_REPO }}"
