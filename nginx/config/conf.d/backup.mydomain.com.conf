# replace "mydomain" with your own domain


# http with redirect to https and with .well-known path for certbot
server {
    listen 80;

    server_name backup.mydomain.com;
    server_tokens off;

    location /.well-known/ {
        root /var/www/backup.mydomain.com;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 50116 ssl proxy_protocol;
    http2 on;
    server_name backup.mydomain.com;

    ssl_certificate /etc/nginx/ssl/live/backup.mydomain.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/backup.mydomain.com/privkey.pem;

    add_header Content-Security-Policy upgrade-insecure-requests;
    client_max_body_size 0;  # Allow unlimited upload size

    # location /handclasp-preflight-uncolored-item-mouth/ {
    location / {
        if ($private_net_access = 0) {
            return 403;
        }
        # grpc_pass grpcs://kopia:40110; # kopia docker container name and its internal port in the "revproxy" docker network
        # grpc_pass grpcs://127.0.0.1:40110; # kopia docker container name and its internal port in the "revproxy" docker network
        proxy_pass http://restic-server:8000; # service path
        proxy_redirect off;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        # proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port  $server_port;

        access_log /var/log/nginx/backup.access.log proxied;
        access_log /var/log/nginx/backup.access.bad.log proxied if=$bad_status;
        error_log  /var/log/nginx/backup.error.log;
    }
}
