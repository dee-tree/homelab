# replace "mydomain" with your own domain

# http with redirect to https and with .well-known path for certbot
server {
    listen 80;

    server_name monitor.mydomain.com;
    server_tokens off;

    location /.well-known/ {
        root /var/www/monitor.mydomain.com;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 50112 ssl proxy_protocol;
    http2 on;
    server_name monitor.mydomain.com;

    root /usr/share/nginx/html;
    index index.html index.htm;

    ssl_certificate /etc/nginx/ssl/live/monitor.mydomain.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/monitor.mydomain.com/privkey.pem;
    
    location / {
        # rewrite  ^/grafana/(.*)  /$1 break;
        proxy_pass http://grafana:3000; # service path
        # proxy_set_header Upgrade           $http_upgrade;
        # proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port  $server_port;

        access_log /var/log/nginx/grafana.access.log proxied;
        access_log /var/log/nginx/grafana.access.bad.log proxied if=$bad_status;
        error_log  /var/log/nginx/grafana.error.log;
    }

    # Proxy Grafana Live WebSocket connections.
    location /api/live {
        # rewrite  ^/grafana/(.*)  /$1 break;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_pass http://grafana:3000;
    }
}

