services:
  seafile-mariadb:
    image: mariadb:11.7
    container_name: seafile-mariadb
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${SEAFILE_DB_INIT_ROOT_PASSWORD:-}
      - MYSQL_LOG_CONSOLE=true
      - MARIADB_AUTO_UPGRADE=1
      - MARIADB_USER=${SEAFILE_DB_USER}
      - MARIADB_PASSWORD=${SEAFILE_DB_PASSWORD}
    volumes:
      - mariadbdata:/var/lib/mysql
    networks:
      - seafile
    healthcheck:
      test:
        [
          "CMD",
          "/usr/local/bin/healthcheck.sh",
          "--connect",
          "--mariadbupgrade",
          "--innodb_initialized",
        ]
      interval: 20s
      start_period: 30s
      timeout: 5s
      retries: 10

  memcached:
    image: memcached:1.6
    container_name: seafile-memcached
    restart: always
    entrypoint: memcached -m 256
    networks:
      - seafile

# instead of memcached
  # seafile-redis:
  #   image: redis
  #   container_name: seafile-redis
  #   restart: unless-stopped
  #   command:
  #     - /bin/sh
  #     - -c
  #     - redis-server --requirepass "$$REDIS_PASSWORD"
  #   environment:
  #     - REDIS_PASSWORD=${REDIS_PASSWORD:-}
  #   networks:
  #     - seafile

  elasticsearch:
    image: elasticsearch:8.16.4
    container_name: seafile-elasticsearch
    restart: always
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms2g -Xmx2g"
      - "xpack.security.enabled=false"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    mem_limit: 4g
    volumes:
      - elasticsearch:/usr/share/elasticsearch/data"
    networks:
      - seafile

