services:
  seafile-mariadb:
    image: mariadb:11.7
    container_name: seafile-mariadb
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${SEAFILE_DB_INIT_ROOT_PASSWORD:-}
      - MARIADB_AUTO_UPGRADE=1
      - MARIADB_USER=${SEAFILE_DB_USER}
      - MARIADB_PASSWORD=${SEAFILE_DB_PASSWORD}
    volumes:
      - mariadbdata:/var/lib/mysql
      - /var/log/seafile/db:/var/log/mysql
    networks:
      - seafile
    healthcheck:
      test:
        [
          "CMD",
          "/usr/local/bin/healthcheck.sh",
          "--connect",
          "--mariadbupgrade",
          "--innodb_initialized",
        ]
      interval: 20s
      start_period: 30s
      timeout: 5s
      retries: 10

# instead of memcached
  seafile-redis:
    image: redis
    container_name: seafile-redis
    restart: unless-stopped
    command:
      - /bin/sh
      - -c
      - redis-server --requirepass "$$REDIS_PASSWORD"
    environment:
      - REDIS_PASSWORD=${SEAFILE_REDIS_PASSWORD:-}
    networks:
      - seafile

# instead of elasticsearch
  seasearch:
    image: seafileltd/seasearch-nomkl:1.0-latest
    container_name: seafile-seasearch
    restart: unless-stopped
    volumes:
      - vcache:/opt/seasearch/data
      - /var/log/seafile/seasearch:/var/log/seafile/seasearch
    environment:
      - SS_FIRST_ADMIN_USER=${SEAFILE_INIT_SEASEARCH_ADMIN_USER:-}
      - SS_FIRST_ADMIN_PASSWORD=${SEAFILE_INIT_SEASEARCH_ADMIN_PASSWORD:-}
      - SS_MAX_OBJ_CACHE_SIZE=${SS_MAX_OBJ_CACHE_SIZE:-10GB}
      - SS_STORAGE_TYPE=${SS_STORAGE_TYPE:-disk}
      # S3: set if use S3 storage
      - S3_SS_BUCKET=${S3_SS_BUCKET:-}
      - S3_KEY_ID=${S3_KEY_ID:-}
      - S3_USE_V4_SIGNATURE=${S3_USE_V4_SIGNATURE:-true}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-}
      - S3_HOST=${S3_HOST:-}
      - S3_USE_HTTPS=${S3_USE_HTTPS:-true}
      - S3_PATH_STYLE_REQUEST=${S3_PATH_STYLE_REQUEST:-true}
      - S3_AWS_REGION=${S3_AWS_REGION:-us-east-1}
      - S3_SSE_C_KEY=${S3_SSE_C_KEY:-}
      - SS_LOG_TO_STDOUT=false
      - SS_LOG_DIR=/var/log/seafile/seasearch
      - SS_LOG_LEVEL=info
      # SeaSeasrch Proxy
      - SEAFILE_LOG_TO_STDOUT=false
      - SEATABLE_LOG_TO_STDOUT=false
      # for cluster
      - SS_SERVER_MODE=${SS_SERVER_MODE:-}
      - SS_CLUSTER_ID=${SS_CLUSTER_ID:-}
      - SS_CLUSTER_PROXY_HOST=${SS_CLUSTER_PROXY_HOST:-0.0.0.0}
      - SS_CLUSTER_PROXY_PORT=${SS_CLUSTER_PROXY_PORT:-4082}
      - SS_CLUSTER_MANAGER_ADDR=${SS_CLUSTER_MANAGER_ADDR:-127.0.0.1:4081}
      - SS_ETCD_USERNAME=${SS_ETCD_USERNAME:-}
      - SS_ETCD_PASSWORD=${SS_ETCD_PASSWORD:-}
      - SS_ETCD_ENDPOINTS=${SS_ETCD_ENDPOINTS:-127.0.0.1:2379}
      - SS_ETCD_PREFIX=${SS_ETCD_PREFIX:-/zinc}
      - SS_CLUSTER_PROXY_LOG_DIR=${SS_CLUSTER_PROXY_LOG_DIR:--/opt/seasearch/data/log}
      - SS_CLUSTER_MANAGER_HOST=${SS_CLUSTER_MANAGER_HOST:-0.0.0.0}
      - SS_CLUSTER_MANAGER_PORT=${SS_CLUSTER_MANAGER_PORT:-4081}
    networks:
      - seafile

  seafile:
    image: seafileltd/seafile-pro-mc:13.0-latest # seafile pro edition
    container_name: seafile
    restart: always
    ports:
      - "${PORT}:80"
    volumes:
      - vdata:/shared
      # - /var/log/seafile/seafile:/opt/seafile/logs
      - /var/log/seafile:/shared/seafile/logs
      - /var/log/seafile/system:/shared/logs/var-log
    environment:
      - SEAFILE_MYSQL_DB_HOST=seafile-mariadb
      - SEAFILE_MYSQL_DB_PORT=${SEAFILE_MYSQL_DB_PORT:-3306}
      - SEAFILE_MYSQL_DB_USER=${SEAFILE_DB_USER:-seafile}
      - INIT_SEAFILE_MYSQL_ROOT_PASSWORD=${SEAFILE_DB_INIT_ROOT_PASSWORD:-}
      - SEAFILE_MYSQL_DB_PASSWORD=${SEAFILE_DB_PASSWORD:?Variable is not set or empty}
      - SEAFILE_MYSQL_DB_CCNET_DB_NAME=${SEAFILE_MYSQL_DB_CCNET_DB_NAME:-ccnet_db}
      - SEAFILE_MYSQL_DB_SEAFILE_DB_NAME=${SEAFILE_MYSQL_DB_SEAFILE_DB_NAME:-seafile_db}
      - SEAFILE_MYSQL_DB_SEAHUB_DB_NAME=${SEAFILE_MYSQL_DB_SEAHUB_DB_NAME:-seahub_db}
      - TIME_ZONE=${TZ:-Etc/UTC}
      - INIT_SEAFILE_ADMIN_EMAIL=${SEAFILE_INIT_ADMIN_EMAIL:-me@example.com}
      - INIT_SEAFILE_ADMIN_PASSWORD=${SEAFILE_INIT_ADMIN_PASSWORD:-asecret}
      - SEAFILE_SERVER_HOSTNAME=${SEAFILE_DOMAIN:?Variable is not set or empty}
      - SEAFILE_SERVER_PROTOCOL=https
      - SEAFILE_SERVER_LETSENCRYPT=false
      - SITE_ROOT=/
      - NON_ROOT=${NON_ROOT:-false}
      - JWT_PRIVATE_KEY=${SEAFILE_JWT_PRIVATE_KEY:?Variable is not set or empty}
      - SEAFILE_LOG_TO_STDOUT=false
      - ENABLE_SEADOC=${ENABLE_SEADOC:-true}
      - SEADOC_SERVER_URL=${SEAFILE_SERVER_PROTOCOL:-http}://${SEAFILE_DOMAIN:?Variable is not set or empty}/sdoc-server

      - CACHE_PROVIDER=redis
      - REDIS_HOST=seafile-redis
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${SEAFILE_REDIS_PASSWORD}
      - SEAF_SERVER_STORAGE_TYPE=${SEAF_SERVER_STORAGE_TYPE:-}

      ### Optional S3 config
      - INIT_S3_STORAGE_BACKEND_CONFIG=${INIT_S3_STORAGE_BACKEND_CONFIG:-false}
      - S3_COMMIT_BUCKET=${INIT_S3_COMMIT_BUCKET:-}
      - S3_FS_BUCKET=${INIT_S3_FS_BUCKET:-}
      - S3_BLOCK_BUCKET=${INIT_S3_BLOCK_BUCKET:-}
      - S3_KEY_ID=${INIT_S3_KEY_ID:-}
      - S3_SECRET_KEY=${INIT_S3_SECRET_KEY:-}
      - S3_USE_V4_SIGNATURE=${INIT_S3_USE_V4_SIGNATURE:-true}
      - S3_AWS_REGION=${INIT_S3_AWS_REGION:-us-east-1}
      - S3_HOST=${INIT_S3_HOST:-us-east-1}
      - S3_USE_HTTPS=${INIT_S3_USE_HTTPS:-true}
      - FORCE_HTTPS_IN_CONF=${FORCE_HTTPS_IN_CONF}

      - S3_PATH_STYLE_REQUEST=${S3_PATH_STYLE_REQUEST:-false}
      - S3_SSE_C_KEY=${S3_SSE_C_KEY:-}

      - ENABLE_NOTIFICATION_SERVER=${ENABLE_NOTIFICATION_SERVER:-false}
      - INNER_NOTIFICATION_SERVER_URL=${INNER_NOTIFICATION_SERVER_URL:-http://notification-server:8083}
      - NOTIFICATION_SERVER_URL=${NOTIFICATION_SERVER_URL:-${SEAFILE_SERVER_PROTOCOL:-http}://${SEAFILE_DOMAIN:?Variable is not set or empty}/notification}
      - ENABLE_SEAFILE_AI=${ENABLE_SEAFILE_AI:-false}
      - SEAFILE_AI_SERVER_URL=${SEAFILE_AI_SERVER_URL:-http://seafile-ai:8888}
      - SEAFILE_AI_SECRET_KEY=${SEAFILE_JWT_PRIVATE_KEY:?Variable is not set or empty}
      - MD_FILE_COUNT_LIMIT=${MD_FILE_COUNT_LIMIT:-100000}
    depends_on:
      seafile-mariadb:
        condition: service_healthy
      seafile-redis:
        condition: service_started
      seasearch:
        condition: service_started
    networks:
      - seafile
      - revproxy
    labels:
      - traefik.enable=true
      - traefik.http.services.seafile.loadbalancer.server.port=80
      - traefik.http.routers.seafile.rule=Host(`${SEAFILE_SUBDOMAIN}.${DOMAIN_NAME}`)
      - traefik.http.routers.seafile.entrypoints=websec-exposed,websec
      - traefik.http.routers.seafile.service=seafile
      - traefik.http.routers.seafile.tls=true
      - traefik.http.routers.seafile.tls.certresolver=production

networks:
  seafile:
    external: true
  revproxy:
    external: true

volumes:
  vdata:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${VDATA_PATH}
  mariadbdata:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${VMARIADB_DATA_PATH}
  vcache:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${VCACHE_DATA_PATH}

