services:
  baikal:
    image: ckulka/baikal:nginx
    container_name: baikal
    restart: always
    ports:
      - 127.0.0.1:${BAIKAL_PORT}:80
    volumes:
      - vconfig:/var/www/baikal/config
      - vdata:/var/www/baikal/Specific
    networks:
      - revproxy
      - baikal
    labels:
      - traefik.enable=true
      - traefik.http.routers.baikal.rule=Host(`${BAIKAL_SUBDOMAIN}.${DOMAIN_NAME}`) || Host(`${XRAY_MASKING_SUBDOMAIN}.${DOMAIN_NAME}`) # for masking service with xray
      - traefik.http.services.baikal.loadbalancer.server.port=80
      - traefik.http.routers.baikal.entrypoints=websec-exposed,web-exposed
      - traefik.http.routers.baikal.service=baikal
      - traefik.http.routers.baikal.tls=true
      - traefik.http.routers.baikal.tls.certresolver=production

  baikal-db:
    image: mariadb:12 # it could be mysql compatible db
    container_name: baikal-db
    restart: always
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - baikal
    environment:
      MARIADB_DATABASE: ${BAIKAL_DB_NAME}
      MARIADB_USER: ${BAIKAL_DB_USER}
      MARIADB_PASSWORD: ${BAIKAL_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${BAIKAL_DB_ROOT_PASSWORD}
    volumes:
      - vdb:/var/lib/mysql
      - vdb_config:/etc/mysql

volumes:
  vconfig:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${BAIKAL_DATA_PATH}/config
  vdata:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${BAIKAL_DATA_PATH}/Specific
  vdb:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${BAIKAL_DATA_PATH}/db
  vdb_config:

networks:
  revproxy:
    external: true
  baikal:
