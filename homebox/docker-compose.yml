services:
  homebox:
    image: ghcr.io/sysadminsmedia/homebox:latest
#   image: ghcr.io/sysadminsmedia/homebox:latest-rootless
    container_name: homebox
    restart: always
    environment:
      - HBOX_LOG_LEVEL=info
      - HBOX_LOG_FORMAT=text
      - HBOX_WEB_MAX_FILE_UPLOAD=15
      # Please consider allowing analytics to help us improve Homebox (basic computer information, no personal data)
      - HBOX_OPTIONS_ALLOW_ANALYTICS=false
      - HBOX_OPTIONS_CURRENCY_CONFIG=/config/currency.cfg.json
      - HBOX_WEB_MAX_UPLOAD=100 # MB
      - HBOX_OPTIONS_ALLOW_REGISTRATION=false

      - HBOX_DATABASE_DRIVER=postgres
      - HBOX_DATABASE_HOST=homebox-postgres
      - HBOX_DATABASE_PORT=5432
      - HBOX_DATABASE_DATABASE=${HOMEBOX_DB_NAME}
      - HBOX_DATABASE_USERNAME=${HOMEBOX_DB_USER}
      - HBOX_DATABASE_PASSWORD=${HOMEBOX_DB_PASSWORD}
      - HBOX_DATABASE_SSL_MODE=disable # for local db container it's acceptable

      - TZ=${TZ}
    networks:
      - homebox
      - revproxy
    volumes:
      - vdata:/data/
      - ./config/currency.cfg:/config/currency.cfg.json
    ports:
      - 127.0.0.1:${PORT}:7745
    depends_on:
      - homebox-postgres
    labels:
      - traefik.enable=true
      - traefik.http.services.homebox.loadbalancer.server.port=7745
      - traefik.http.routers.homebox.rule=Host(`${HOMEBOX_SUBDOMAIN}.${DOMAIN_NAME}`)
      - traefik.http.routers.homebox.entrypoints=websec-exposed
      - traefik.http.routers.homebox.service=homebox
      - traefik.http.routers.homebox.tls=true
      - traefik.http.routers.homebox.tls.certresolver=production

  homebox-postgres:
    image: postgres:16-alpine
    container_name: homebox-postgres
    restart: always
    environment:
      - POSTGRES_DB=${HOMEBOX_DB_NAME}
      - POSTGRES_USER=${HOMEBOX_DB_USER}
      - POSTGRES_PASSWORD=${HOMEBOX_DB_PASSWORD}
      - TZ=${TZ}
    networks:
        - homebox
    volumes:
        - pgdata:/var/lib/postgresql/data

networks:
  revproxy:
    external: true
  homebox:
    external: true

volumes:
  vdata:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH}
  pgdata:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PGDATA_PATH}
