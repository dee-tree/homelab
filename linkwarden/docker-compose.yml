services:
    linkwarden-postgres:
        image: postgres:16-alpine
        container_name: linkwarden-postgres
        environment:
            - POSTGRES_PASSWORD=${LINKWARDEN_DB_PASSWORD}
            - POSTGRES_USER=${LINKWARDEN_DB_USERNAME}
            - POSTGRES_DB=${LINKWARDEN_DB_NAME}
        # ports:
            # - 127.0.0.1:5432:5432
        restart: unless-stopped
        networks:
            - linkwarden
        volumes:
            - pgdata:/var/lib/postgresql/data
    
    linkwarden:
        image: ghcr.io/linkwarden/linkwarden:latest
        container_name: linkwarden
        environment:
            - DATABASE_URL=postgresql://${LINKWARDEN_DB_USERNAME}:${LINKWARDEN_DB_PASSWORD}@linkwarden-postgres:5432/${LINKWARDEN_DB_NAME}
            - NEXTAUTH_URL=${LINKWARDEN_NEXTAUTH_URL}
            - NEXTAUTH_SECRET=${LINKWARDEN_NEXTAUTH_SECRET}
            - NEXT_PUBLIC_DISABLE_REGISTRATION=${LINKWARDEN_IS_PUBLIC_AUTH_DISABLED}
        ports:
            - "${LINKWARDEN_DOCKER_PORT}:3000"
        volumes:
            - data:/data/data
        restart: unless-stopped
        networks:
            - revproxy
            - linkwarden
        depends_on:
            - linkwarden-postgres

networks:
    revproxy:
        external: true
    linkwarden:
        external: true

volumes:
    pgdata:
        driver: local
        driver_opts:
            type: none
            o: bind
            device: ${LINKWARDEN_DATA_DB_PATH}
    data:
        driver: local
        driver_opts:
            type: none
            o: bind
            device: ${LINKWARDEN_DATA_PATH}
