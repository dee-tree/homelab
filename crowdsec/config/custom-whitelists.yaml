# Put it in `config/parsers/s02-enrich/` directory inside the container

name: crowdsecurity/whitelists
description: "Whitelist trusted IPs"
whitelist:
  reason: "Private IPs"
  ip:
    - "xxx.xxx.xxx.xxx" # Home. Jellyfin was throwing 403 forbidden errors on some clients.
    - "127.0.0.1" # Local Host
  cidr:
    - "192.168.0.0/16" # Local IPs + ZeroTier Network
    - "10.0.0.0/8" # Local IPs
    - "172.16.0.0/12" # Local/Docker IPs
